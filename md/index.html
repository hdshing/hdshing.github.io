<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown 与代码在线阅读器</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css" media="(prefers-color-scheme: light)">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/common.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Markdown 与代码在线阅读器</h1>
            <p class="subtitle">上传本地文件或输入 URL，清晰阅读 Markdown 和代码</p>
        </header>

        <div class="input-section">
            <!-- 文件上传 -->
            <div class="input-group">
                <label for="fileInput">上传本地 Markdown 或代码文件</label>
                <input type="file" id="fileInput" accept=".md,.markdown,.txt,.js,.mjs,.cjs,.jsx,.ts,.tsx,.py,.pyw,.java,.json,.jsonc,.html,.htm,.css,.scss,.less,.xml,.yaml,.yml,.sh,.bash,.ps1,.sql,.c,.h,.cpp,.hpp,.cs,.go,.rs,.php,.rb,.swift,.kt,.kts,.vue,.svelte">
                <p class="file-hint">支持 Markdown、JavaScript、Python、Java、JSON、HTML、CSS 等常见文本代码格式</p>
            </div>

            <div class="divider">或</div>

            <!-- URL 输入 -->
            <div class="input-group">
                <label for="urlInput">输入 Markdown 或代码文件 URL</label>
                <div class="url-input-wrapper">
                    <input type="text" id="urlInput" placeholder="https://example.com/readme.md 或 app.js">
                    <button id="loadUrlBtn">加载</button>
                </div>
            </div>
        </div>

        <!-- 显示区域 -->
        <div id="content" class="markdown-body"></div>

        <footer>
            <p>Powered by <a href="https://marked.js.org/" target="_blank">marked.js</a></p>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
